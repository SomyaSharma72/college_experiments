<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A dynamic page rendered by an Express server.">
    <title>Daily Hello | Experiment 10</title>
    <style>
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; color: #29364b; background: #f0f3f8; font: 1rem/1.6 "Segoe UI", Arial, sans-serif; }
        main { width: min(100%, 560px); padding: 36px; border: 1px solid #dce2ed; border-radius: 16px; background: white; box-shadow: 0 16px 40px #26304712; }
        .eyebrow { color: #536aa2; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 8px 0; font-size: 2.7rem; line-height: 1.05; letter-spacing: -.05em; }
        .time { display: inline-block; margin-top: 12px; padding: 8px 12px; border-radius: 8px; background: #eef1f7; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Experiment 10 · Dynamic site</p>
        <h1>Hello from the server.</h1>
        <p>This page was delivered by Node.js and Express. Its current time was inserted by the server for this request.</p>
        <p class="time"><time>{{SERVER_TIME}}</time></p>
    </main>
</body>
</html>
