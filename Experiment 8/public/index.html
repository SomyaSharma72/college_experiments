<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage a book collection with a simple REST API.">
    <title>Book Shelf | Experiment 8</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <p class="eyebrow">Experiment 8 · Node.js + Express</p>
        <h1>Book Shelf</h1>
        <p>A small collection manager powered by a RESTful CRUD API.</p>
    </header>
    <main>
        <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title">Add a book</h2>
            <form id="book-form">
                <input id="book-id" name="id" type="hidden">
                <label>Title <input name="title" required maxlength="120"></label>
                <label>Author <input name="author" required maxlength="100"></label>
                <label>Publication year <input name="year" type="number" min="1"></label>
                <div class="form-actions">
                    <button type="submit" id="save-button">Add book</button>
                    <button type="button" class="secondary" id="cancel-button" hidden>Cancel edit</button>
                </div>
            </form>
            <p id="message" role="status" aria-live="polite"></p>
        </section>
        <section aria-labelledby="books-title">
            <div class="section-heading">
                <h2 id="books-title">Your books</h2>
                <span id="book-count"></span>
            </div>
            <ul id="book-list" class="book-list"></ul>
        </section>
        <details class="api-note">
            <summary>API routes</summary>
            <p><code>GET /api/books</code> · <code>POST /api/books</code> · <code>GET /api/books/:id</code> · <code>PUT /api/books/:id</code> · <code>DELETE /api/books/:id</code></p>
        </details>
    </main>
</body>
</html>
